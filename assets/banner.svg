<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Animated Ambient Light Gradients -->
    <radialGradient id="glowLithium" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCopper" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.1;0.3;0.1" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRareEarth" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.15;0.35;0.15" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Shimmer Text Gradient -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-600,0" to="600,0" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Badge Gradients -->
    <linearGradient id="badgeLi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="badgeCu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="badgeAg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="badgeNi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="badgeREE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glowing Line Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes pulseNode {
        0%, 100% { r: 3.5; opacity: 0.7; }
        50% { r: 6.5; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      @keyframes floatSubtle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatOpposite {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      .pulse-1 { animation: pulseNode 3s ease-in-out infinite; }
      .pulse-2 { animation: pulseNode 4s ease-in-out 1s infinite; }
      .pulse-3 { animation: pulseNode 3.5s ease-in-out 2s infinite; }
      .float-group-1 { animation: floatSubtle 6s ease-in-out infinite; }
      .float-group-2 { animation: floatOpposite 7s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 6, 12; animation: dashMove 5s linear infinite; }
      .data-stream-fast { stroke-dasharray: 4, 8; animation: dashMove 3s linear infinite; }
      .font-brand { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Radial Ambient Lighting -->
  <rect width="1200" height="360" rx="16" fill="url(#glowLithium)" />
  <rect width="1200" height="360" rx="16" fill="url(#glowCopper)" />
  <rect width="1200" height="360" rx="16" fill="url(#glowRareEarth)" />

  <!-- Hexagonal Tech & Crystal Grid (Background Overlay) -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1" fill="none">
    <path d="M 100,50 L 140,73 L 140,119 L 100,142 L 60,119 L 60,73 Z" />
    <path d="M 180,50 L 220,73 L 220,119 L 180,142 L 140,119 L 140,73 Z" />
    <path d="M 140,119 L 180,142 L 180,188 L 140,211 L 100,188 L 100,142 Z" />
    
    <path d="M 1060,180 L 1100,203 L 1100,249 L 1060,272 L 1020,249 L 1020,203 Z" />
    <path d="M 1140,180 L 1180,203 L 1180,249 L 1140,272 L 1100,249 L 1100,203 Z" />
    <path d="M 1100,249 L 1140,272 L 1140,318 L 1100,341 L 1060,318 L 1060,249 Z" />

    <!-- Grid lines across banner -->
    <line x1="0" y1="90" x2="1200" y2="90" stroke-dasharray="4, 16" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke-dasharray="4, 16" />
    <line x1="0" y1="270" x2="1200" y2="270" stroke-dasharray="4, 16" />
    <line x1="300" y1="0" x2="300" y2="360" stroke-dasharray="4, 16" />
    <line x1="600" y1="0" x2="600" y2="360" stroke-dasharray="4, 16" />
    <line x1="900" y1="0" x2="900" y2="360" stroke-dasharray="4, 16" />
  </g>

  <!-- Animated Circuit & Lattice Data Streams -->
  <g fill="none" opacity="0.6">
    <path d="M 80,180 C 220,130 320,240 480,180 S 700,120 850,180 S 1020,230 1120,180" 
          stroke="#38bdf8" stroke-width="1.5" class="data-stream" filter="url(#glowFilter)" />
    <path d="M 120,260 C 280,290 400,210 580,250 S 840,300 980,220 S 1080,250 1160,200" 
          stroke="#c084fc" stroke-width="1.5" class="data-stream-fast" filter="url(#glowFilter)" />
    <path d="M 50,100 C 200,60 380,120 540,90 S 820,40 1000,100 S 1100,80 1150,120" 
          stroke="#f59e0b" stroke-width="1" stroke-dasharray="3, 10" class="data-stream" />
  </g>

  <!-- Glowing Lattice Nodes -->
  <g>
    <circle cx="220" cy="142" r="4" fill="#38bdf8" class="pulse-1" />
    <circle cx="480" cy="180" r="5" fill="#a855f7" class="pulse-2" />
    <circle cx="700" cy="120" r="4" fill="#00f0ff" class="pulse-3" />
    <circle cx="850" cy="180" r="5" fill="#f59e0b" class="pulse-1" />
    <circle cx="1020" cy="230" r="4" fill="#34d399" class="pulse-2" />
    <circle cx="340" cy="270" r="3.5" fill="#38bdf8" class="pulse-3" />
    <circle cx="920" cy="275" r="4.5" fill="#c084fc" class="pulse-1" />
  </g>

  <!-- Floating Mineral Badges (Left Side) -->
  <g class="float-group-1">
    <!-- Lithium Badge -->
    <g transform="translate(60, 65)">
      <rect width="64" height="64" rx="14" fill="url(#badgeLi)" stroke="#06b6d4" stroke-width="1.5" />
      <text x="32" y="32" text-anchor="middle" fill="#22d3ee" font-size="20" font-weight="bold" class="font-brand">Li</text>
      <text x="32" y="48" text-anchor="middle" fill="#94a3b8" font-size="9" class="font-brand">3 • LITHIUM</text>
    </g>
    <!-- Silver Badge -->
    <g transform="translate(145, 175)">
      <rect width="64" height="64" rx="14" fill="url(#badgeAg)" stroke="#94a3b8" stroke-width="1.5" />
      <text x="32" y="32" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="bold" class="font-brand">Ag</text>
      <text x="32" y="48" text-anchor="middle" fill="#94a3b8" font-size="9" class="font-brand">47 • SILVER</text>
    </g>
  </g>

  <!-- Floating Mineral Badges (Right Side) -->
  <g class="float-group-2">
    <!-- Copper Badge -->
    <g transform="translate(1075, 65)">
      <rect width="64" height="64" rx="14" fill="url(#badgeCu)" stroke="#f97316" stroke-width="1.5" />
      <text x="32" y="32" text-anchor="middle" fill="#fb923c" font-size="20" font-weight="bold" class="font-brand">Cu</text>
      <text x="32" y="48" text-anchor="middle" fill="#94a3b8" font-size="9" class="font-brand">29 • COPPER</text>
    </g>
    <!-- Rare Earth / Neodymium Badge -->
    <g transform="translate(990, 175)">
      <rect width="64" height="64" rx="14" fill="url(#badgeREE)" stroke="#a855f7" stroke-width="1.5" />
      <text x="32" y="32" text-anchor="middle" fill="#c084fc" font-size="20" font-weight="bold" class="font-brand">Nd</text>
      <text x="32" y="48" text-anchor="middle" fill="#cbd5e1" font-size="9" class="font-brand">60 • NEODYMIUM</text>
    </g>
  </g>

  <!-- Center Decorative Crystal Icon / Geode Accent -->
  <g transform="translate(600, 70)">
    <g transform="scale(0.85) translate(-40, -35)">
      <!-- Animated rotating crystal ring -->
      <circle cx="40" cy="35" r="32" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6, 8" opacity="0.4">
        <animateTransform attributeName="transform" type="rotate" from="0 40 35" to="360 40 35" dur="20s" repeatCount="indefinite" />
      </circle>
      <!-- Crystal Shape -->
      <polygon points="40,5 65,25 40,65 15,25" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <polygon points="40,5 65,25 40,38" fill="#38bdf8" fill-opacity="0.3" />
      <polygon points="40,5 15,25 40,38" fill="#818cf8" fill-opacity="0.4" />
      <polygon points="40,65 65,25 40,38" fill="#c084fc" fill-opacity="0.2" />
      <polygon points="40,65 15,25 40,38" fill="#06b6d4" fill-opacity="0.3" />
      <!-- Core Glow Sparkle -->
      <circle cx="40" cy="38" r="4" fill="#ffffff" filter="url(#glowFilter)" />
    </g>
  </g>

  <!-- Main Typography -->
  <g class="font-brand" text-anchor="middle">
    <!-- Top Pill / Category Tag -->
    <g transform="translate(600, 140)">
      <rect x="-135" y="-14" width="270" height="26" rx="13" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle cx="-112" cy="-1" r="4" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="6" y="3" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2.5">STRATEGIC RESOURCE DATABASE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="200" fill="url(#shimmerGrad)" font-size="46" font-weight="900" letter-spacing="5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.7))">
      CRITICAL MINERALS
    </text>

    <!-- Subtitle -->
    <text x="600" y="235" fill="#94a3b8" font-size="14.5" font-weight="400" letter-spacing="1.2">
      Global Reserves, Mining Capacity &amp; Supply Chain Analytics for Clean Tech &amp; Rare Earths
    </text>

    <!-- Mineral Pills Bottom Row -->
    <g transform="translate(600, 290)">
      <!-- Silver -->
      <g transform="translate(-290, 0)">
        <rect x="-48" y="-14" width="96" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="4" fill="#e2e8f0" font-size="12" font-weight="600">🥈 Silver</text>
      </g>
      <!-- Copper -->
      <g transform="translate(-145, 0)">
        <rect x="-52" y="-14" width="104" height="28" rx="8" fill="#1e293b" stroke="#7c2d12" stroke-width="1" />
        <text x="0" y="4" fill="#fdba74" font-size="12" font-weight="600">🥉 Copper</text>
      </g>
      <!-- Lithium -->
      <g transform="translate(0, 0)">
        <rect x="-52" y="-14" width="104" height="28" rx="8" fill="#1e293b" stroke="#0e7490" stroke-width="1" />
        <text x="0" y="4" fill="#67e8f9" font-size="12" font-weight="600">🔋 Lithium</text>
      </g>
      <!-- Nickel -->
      <g transform="translate(145, 0)">
        <rect x="-50" y="-14" width="100" height="28" rx="8" fill="#1e293b" stroke="#065f46" stroke-width="1" />
        <text x="0" y="4" fill="#6ee7b7" font-size="12" font-weight="600">⚙️ Nickel</text>
      </g>
      <!-- Rare Earths -->
      <g transform="translate(290, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="8" fill="#1e293b" stroke="#6b21a8" stroke-width="1" />
        <text x="0" y="4" fill="#d8b4fe" font-size="12" font-weight="600">🧲 Rare Earths</text>
      </g>
    </g>
  </g>
</svg>
